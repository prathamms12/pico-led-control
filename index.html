<!DOCTYPE html>
<html>
<head>
  <title>Traffic Signal Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec);
      padding: 20px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      transition: all 0.3s ease-in-out;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #00796B;
    }
    .section {
      margin-bottom: 25px;
    }
    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #555;
    }
    label {
      display: block;
      margin: 8px 0;
      background: #f0f0f0;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    input[type="radio"] {
      margin-right: 10px;
    }
    label:hover {
      background: #e0e0e0;
    }
    input[type="radio"]:checked + label {
      background-color: #b2dfdb;
      font-weight: bold;
    }
    @media (max-width: 500px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Traffic Signal Control</h1>

    <div class="section">
      <div class="section-title">Mode</div>
      <label><input type="radio" name="mode" value="automatic" checked> Automatic</label>
      <label><input type="radio" name="mode" value="manual"> Manual</label>
    </div>

    <div class="section" id="manualOptions" style="display: none;">
      <div class="section-title">Manual Commands</div>
      <label><input type="radio" name="manual" value="line1"> Line 1</label>
      <label><input type="radio" name="manual" value="line2"> Line 2</label>
      <label><input type="radio" name="manual" value="line3"> Line 3</label>
      <label><input type="radio" name="manual" value="line4"> Line 4</label>
      <label><input type="radio" name="manual" value="cycling"> Cycling</label>
    </div>
  </div>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCTG0PTj1FeTlc2D6yQ7mpWLqTURH3Q7xQ",
      authDomain: "ambulance-controller.firebaseapp.com",
      databaseURL: "https://ambulance-controller-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ambulance-controller",
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const modeRadios = document.getElementsByName("mode");
    const manualRadios = document.getElementsByName("manual");
    const manualOptions = document.getElementById("manualOptions");

    // Handle mode change
    modeRadios.forEach(radio => {
      radio.addEventListener("change", () => {
        const selectedMode = document.querySelector('input[name="mode"]:checked').value;
        db.ref("control/mode").set(selectedMode);
        manualOptions.style.display = selectedMode === "manual" ? "block" : "none";
      });
    });

    // Handle manual option change
    manualRadios.forEach(radio => {
      radio.addEventListener("change", () => {
        const selectedCommand = document.querySelector('input[name="manual"]:checked').value;
        db.ref("control/command").set(selectedCommand);
      });
    });

    // Load current settings from Firebase
    db.ref("control/mode").once("value").then(snapshot => {
      const mode = snapshot.val();
      if (mode === "manual") {
        document.querySelector('input[name="mode"][value="manual"]').checked = true;
        manualOptions.style.display = "block";
      } else {
        document.querySelector('input[name="mode"][value="automatic"]').checked = true;
        manualOptions.style.display = "none";
      }
    });

    db.ref("control/command").once("value").then(snapshot => {
      const command = snapshot.val();
      if (command) {
        const cmdRadio = document.querySelector(`input[name="manual"][value="${command}"]`);
        if (cmdRadio) cmdRadio.checked = true;
      }
    });
  </script>
</body>
</html>

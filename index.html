<!DOCTYPE html>
<html>
<head>
  <title>Traffic Signal Control</title>
  <style>
    body { font-family: Arial; padding: 20px; text-align: center; }
    .hidden { display: none; }
    .data-box { margin-top: 20px; padding: 10px; border: 1px solid #ccc; display: inline-block; text-align: left; }
    button { padding: 10px; margin: 5px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>🚦 Traffic Signal Control Panel</h2>

  <!-- Mode Selection -->
  <div>
    <label><input type="radio" name="mode" value="automatic" checked> Automatic</label>
    <label><input type="radio" name="mode" value="manual"> Manual</label>
  </div>

  <!-- Manual Controls -->
  <div id="manual-controls" class="hidden">
    <button onclick="sendCommand('line1')">Line 1</button>
    <button onclick="sendCommand('line2')">Line 2</button>
    <button onclick="sendCommand('line4')">Line 3</button>
    <button onclick="sendCommand('line3')">Line 4</button>
    <button onclick="sendCommand('cycle')">Cycle</button>
  </div>

  <!-- Display Live Data -->
  <div class="data-box">
    <h3>📡 Live Data from Firebase</h3>
    <p><strong>Mode:</strong> <span id="mode-display">--</span></p>
    <p><strong>Manual Command:</strong> <span id="command-display">--</span></p>
    <p><strong>Latitude:</strong> <span id="lat-display">--</span></p>
    <p><strong>Longitude:</strong> <span id="lon-display">--</span></p>
  </div>

  <script>
    const dbURL = "https://ambulancetracker-78884-default-rtdb.europe-west1.firebasedatabase.app/"; // replace with your database URL

    function setMode(mode) {
      fetch(`${dbURL}mode.json`, {
        method: 'PUT',
        body: JSON.stringify(mode),
      });
      document.getElementById("manual-controls").classList.toggle("hidden", mode !== "manual");
    }

    function sendCommand(command) {
      fetch(`${dbURL}manual_command.json`, {
        method: 'PUT',
        body: JSON.stringify(command),
      });
    }

    document.querySelectorAll('input[name="mode"]').forEach(radio => {
      radio.addEventListener('change', e => setMode(e.target.value));
    });

    function updateData() {
      fetch(`${dbURL}.json`)
        .then(response => response.json())
        .then(data => {
          document.getElementById("mode-display").innerText = data.mode || "--";
          document.getElementById("command-display").innerText = data.manual_command || "--";
          document.getElementById("lat-display").innerText = data.gps?.latitude?.toFixed(6) || "--";
          document.getElementById("lon-display").innerText = data.gps?.longitude?.toFixed(6) || "--";

          // Set the radio based on Firebase mode
          if (data.mode) {
            document.querySelector(`input[name="mode"][value="${data.mode}"]`).checked = true;
            document.getElementById("manual-controls").classList.toggle("hidden", data.mode !== "manual");
          }
        })
        .catch(err => console.error("Failed to fetch Firebase data:", err));
    }

    // Refresh every 2 seconds
    setInterval(updateData, 2000);
    window.onload = updateData;
  </script>
</body>
</html>
